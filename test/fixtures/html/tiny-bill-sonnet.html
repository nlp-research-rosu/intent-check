<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Splitter</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 22rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .75rem 0; }
  input { width: 100%; padding: .4rem; font-size: 1rem; box-sizing: border-box; }
  li { margin: .2rem 0; }
</style>
</head>
<body>
<h1>Bill Splitter</h1>
<label>Total <input id="total" type="number" min="0" step="0.01" value="100"></label>
<label>People <input id="n" type="number" min="1" step="1" value="3"></label>
<ol id="out"></ol>
<p id="sum"></p>
<script>
  const $ = id => document.getElementById(id);
  function split() {
    const cents = Math.round(parseFloat($("total").value) * 100), n = parseInt($("n").value);
    if (!(cents >= 0) || !(n >= 1)) { $("out").innerHTML = ""; $("sum").textContent = ""; return; }
    const base = Math.floor(cents / n), extra = cents - base * n; // first `extra` people pay 1 cent more
    const shares = Array.from({ length: n }, (_, i) => base + (i < extra ? 1 : 0));
    $("out").innerHTML = shares.map(c => `<li>${(c / 100).toFixed(2)}</li>`).join("");
    $("sum").textContent = `Sum: ${(shares.reduce((a, b) => a + b, 0) / 100).toFixed(2)}`;
  }
  document.addEventListener("input", split); split();
</script>
</body>
</html>
