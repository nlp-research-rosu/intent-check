name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build matching CLI for plugin tests
        run: cargo build --manifest-path cli/Cargo.toml --locked
      - name: Add matching CLI to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/cli/target/debug" >> "$GITHUB_PATH"
      - run: npm run test:smoke
