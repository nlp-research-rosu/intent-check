name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - run: sh -n scripts/install-intent-prover.sh
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked
      - name: Check CLI sessions, cancellation and login against controlled servers
        run: |
          python3 tests/check-cli-semantics.py "$PWD/target/debug/intent-prover"
          python3 tests/check-cli-cancellation.py "$PWD/target/debug/intent-prover"
          python3 tests/check-cli-login.py "$PWD/target/debug/intent-prover"
  # Decides whether the Linux host checks run, independently of the core checks above.
  # PRs run it when they touch bin/, lib/, commands/, skills/, .claude-plugin/, .codex-plugin/,
  # .github/, test/integration|helpers|e2e/ or package.json; every other event runs it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -Eq '^(hooks/|bin/|lib/|release/|commands/|skills/|\.claude-plugin/|\.codex-plugin/|\.github/|test/(integration|helpers|e2e)/|package\.json$)'; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
          fi
  integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/integration.yml
