name: release
# Versions are supplied manually. Staging packages live at immutable tags; only
# catalog-staging advances, never the staging development branch or stable catalog.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [production, staging]
        default: production
      version:
        description: Explicit version (e.g. 1.3.0 or 1.3.0-staging.1)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js
  integration:
    uses: ./.github/workflows/integration.yml
  prepare:
    needs: [test, integration]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      v: ${{ steps.prepare.outputs.v }}
      sha: ${{ steps.prepare.outputs.sha }}
      cli: ${{ steps.prepare.outputs.cli }}
      catalog: ${{ steps.prepare.outputs.catalog }}
    env:
      CHANNEL: ${{ inputs.channel }}
      V: ${{ inputs.version }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Prepare versioned channel package
        id: prepare
        run: |
          if [ "$CHANNEL" = production ]; then test "$BRANCH" = main; fi
          node --input-type=module -e '
            const {channel, version} = {channel: process.env.CHANNEL, version: process.env.V};
            const valid = channel === "staging" ? /^\d+\.\d+\.\d+-staging\.\d+$/ : /^\d+\.\d+\.\d+$/;
            if (!["production", "staging"].includes(channel) || !valid.test(version)) process.exit(1);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            git checkout --detach "v$V"
          else
            node scripts/package-channel.mjs "$CHANNEL" "$V"
            git add package.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json cli/Cargo.toml cli/Cargo.lock CHANGELOG.md release/channel commands skills 'scripts/install-intent-prover*'
            git commit -m "release: $CHANNEL v$V"
            git tag "v$V"
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            if (fs.readFileSync("release/channel", "utf8").trim() !== process.env.CHANNEL ||
                JSON.parse(fs.readFileSync("package.json", "utf8")).version !== process.env.V) process.exit(1);
          '
          test "$(git rev-parse "v$V")" = "$(git rev-parse HEAD)"
          git bundle create "$RUNNER_TEMP/release.bundle" "v$V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            import fs from "node:fs";
            const c = JSON.parse(fs.readFileSync("release/channels.json", "utf8"))[process.env.CHANNEL];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `cli=${c.cli}\ncatalog=${c.catalog_branch}\n`);
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release.bundle
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64, windows: false }
          - { runner: macos-15-intel, platform: darwin-x64, windows: false }
          - { runner: ubuntu-latest, platform: linux-x64, windows: false }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, windows: false }
          - { runner: windows-latest, platform: windows-x64, windows: true }
          - { runner: windows-11-arm, platform: windows-arm64, windows: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    env:
      CLI: ${{ needs.prepare.outputs.cli }}
      V: ${{ needs.prepare.outputs.v }}
      ASSET: ${{ needs.prepare.outputs.cli }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: ${{ runner.temp }}
      - name: Check out prepared release
        working-directory: .
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" "refs/tags/v$V:refs/tags/v$V"
          test "$(git rev-parse "v$V")" = "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --release
      - if: ${{ !matrix.windows }}
        shell: bash
        run: |
          test "$("target/release/$CLI" --version)" = "$CLI $V"
          tar -C target/release -czf "$ASSET.tar.gz" "$CLI"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
          else
            shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
          fi
      - if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          if ((& "target/release/$env:CLI.exe" --version) -ne "$env:CLI $env:V") { throw "CLI version mismatch" }
          Compress-Archive "target/release/$env:CLI.exe" "$env:ASSET.zip"
          $hash = (Get-FileHash "$env:ASSET.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET.zip" | Set-Content "$env:ASSET.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ASSET }}
          path: cli/${{ env.ASSET }}.*
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      CHANNEL: ${{ inputs.channel }}
      V: ${{ needs.prepare.outputs.v }}
      CLI: ${{ needs.prepare.outputs.cli }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      CATALOG_BRANCH: ${{ needs.prepare.outputs.catalog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: ${{ runner.temp }}
      - name: Check out prepared release
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" "refs/tags/v$V:refs/tags/v$V"
          test "$(git rev-parse "v$V")" = "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: intent-prover-*
          path: dist
          merge-multiple: true
      - name: Publish complete GitHub release
        run: |
          git fetch origin "$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          if [ "$CHANNEL" = production ] && [ "$head" != "$GITHUB_SHA" ] && [ "$head" != "$RELEASE_SHA" ]; then
            test "$(git log -1 --format=%s FETCH_HEAD)" = "release: publish v$V"
            test "$(git rev-parse FETCH_HEAD^)" = "$RELEASE_SHA"
          fi
          git push origin "refs/tags/v$V"
          state=$(gh release list --limit 1000 --json tagName,isDraft --jq ".[] | select(.tagName == \"v$V\") | .isDraft")
          if [ "$state" = false ]; then
            echo "release v$V already published"
            exit 0
          fi
          for e in sh ps1; do sed "s/__INTENT_PROVER_RELEASE_TAG__/v$V/" "scripts/install-$CLI.$e" > "dist/install-$CLI.$e"; done
          ! grep -l __INTENT_PROVER_RELEASE_TAG__ "dist/install-$CLI."* || { echo "installer release tag missing" >&2; exit 1; }
          assets=(dist/*)
          printf '%s\n' "$CLI"-{darwin,linux}-{x64,arm64}.tar.gz{,.sha256} \
            "$CLI"-windows-{x64,arm64}.zip{,.sha256} "install-$CLI.sh" "install-$CLI.ps1" |
            sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${assets[@]#dist/}" | sort > "$RUNNER_TEMP/local-assets.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/local-assets.txt"
          if [ -z "$state" ]; then
            if [ "$CHANNEL" = production ]; then
              node scripts/bump-version.mjs --notes "$V" > "$RUNNER_TEMP/notes.md"
              gh release create "v$V" --draft --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest=false
            else
              gh release create "v$V" --draft --generate-notes --prerelease --verify-tag --latest=false
            fi
          fi
          gh release upload "v$V" "${assets[@]}" --clobber
          gh release view "v$V" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/uploaded.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/uploaded.txt"
          if [ "$CHANNEL" = production ]; then
            gh release edit "v$V" --draft=false --latest
          else
            gh release edit "v$V" --draft=false --latest=false
          fi
      - name: Expose published version in its channel catalog
        run: |
          node scripts/package-channel.mjs --marketplace "$CHANNEL" "$V" > "$RUNNER_TEMP/marketplace.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = production ]; then
            git fetch origin "$CATALOG_BRANCH"
            if git show FETCH_HEAD:.claude-plugin/marketplace.json | cmp -s - "$RUNNER_TEMP/marketplace.json"; then exit 0; fi
            cp "$RUNNER_TEMP/marketplace.json" .claude-plugin/marketplace.json
            git add .claude-plugin/marketplace.json
            git commit -m "release: publish v$V"
            git push origin "HEAD:refs/heads/$CATALOG_BRANCH"
          else
            # A catalog-only branch preserves source branches and its own history.
            export GIT_INDEX_FILE="$RUNNER_TEMP/catalog.index"
            parent=()
            remote=$(git ls-remote origin "refs/heads/$CATALOG_BRANCH")
            if [ -n "$remote" ]; then
              git fetch origin "refs/heads/$CATALOG_BRANCH"
              previous=$(git rev-parse FETCH_HEAD)
              if git show "$previous":.claude-plugin/marketplace.json | cmp -s - "$RUNNER_TEMP/marketplace.json"; then exit 0; fi
              git read-tree "$previous"
              parent=(-p "$previous")
            else
              git read-tree --empty
            fi
            blob=$(git hash-object -w "$RUNNER_TEMP/marketplace.json")
            git update-index --add --cacheinfo "100644,$blob,.claude-plugin/marketplace.json"
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" "${parent[@]}" -m "release: staging catalog v$V")
            git push origin "$commit:refs/heads/$CATALOG_BRANCH"
          fi
