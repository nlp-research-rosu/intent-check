name: release
# Run from the Actions tab and pick a branch. On main this cuts a release (vX.Y.Z), whose notes are the Unreleased
# section of CHANGELOG.md; on any other branch it cuts a
# prerelease (vX.Y.Z-<branch>.N) and commits the bump to that branch, because users install from the branch head.
# The release carries the intent-check CLI builds for six targets and the two standalone installers; it is created as a
# draft and published only after every asset is uploaded.
# Pushes made with GITHUB_TOKEN do not trigger ci.yml; that is fine because the test job below runs first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node contract/hash.mjs
      - run: node --test test/*.test.js
  # The real claude/codex CLIs on Linux, macOS and Windows (LLM-free), before anything is released.
  integration:
    uses: ./.github/workflows/integration.yml
  bump:
    needs: [test, integration]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      v: ${{ steps.bump.outputs.v }}
      sha: ${{ steps.bump.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Bump, commit, tag, push
        id: bump
        run: |
          CURRENT=$(node -p 'require("./package.json").version')
          if [ "$(git log -1 --format=%s)" = "release: v$CURRENT" ]; then
            # the last commit is already this release's bump (a rerun after a partial failure): do not bump again, only tag if missing
            V=$CURRENT
            if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              git tag "v$V"
              git push origin "v$V"
            fi
          else
            if [ "$BRANCH" = main ]; then
              V=$(node scripts/bump-version.mjs "$BUMP")
            else
              SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-*//; s/-*$//')
              case "$SLUG" in ''|*[!0-9]*) ;; *) SLUG="b$SLUG" ;; esac
              V=$(node scripts/bump-version.mjs "$BUMP" --pre "$SLUG")
            fi
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              echo "tag v$V already exists" >&2
              exit 1
            fi
            git commit -am "release: v$V"
            git tag "v$V"
            git push --atomic origin "HEAD:refs/heads/$BRANCH" "v$V"
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, asset: intent-check-darwin-arm64, windows: false }
          - { runner: macos-15-intel, asset: intent-check-darwin-x64, windows: false }
          - { runner: ubuntu-latest, asset: intent-check-linux-x64, windows: false }
          - { runner: ubuntu-24.04-arm, asset: intent-check-linux-arm64, windows: false }
          - { runner: windows-latest, asset: intent-check-windows-x64, windows: true }
          - { runner: windows-11-arm, asset: intent-check-windows-arm64, windows: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - if: ${{ !matrix.windows }}
        shell: bash
        run: |
          test "$(target/release/intent-check --version)" = "intent-check ${{ needs.bump.outputs.v }}"
          tar -C target/release -czf "${{ matrix.asset }}.tar.gz" intent-check
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi
      - if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          if ((& target/release/intent-check.exe --version) -ne "intent-check ${{ needs.bump.outputs.v }}") { throw "CLI version mismatch" }
          Compress-Archive target/release/intent-check.exe "${{ matrix.asset }}.zip"
          $hash = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content "${{ matrix.asset }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}.*
  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      V: ${{ needs.bump.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: intent-check-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        run: |
          if [ "$(gh release view "v$V" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "release v$V already published"
            exit 0
          fi
          for e in sh ps1; do sed "s/__INTENT_CHECK_RELEASE_TAG__/v$V/" "scripts/install-intent-check.$e" > "dist/install-intent-check.$e"; done
          assets=(dist/*)
          printf '%s\n' intent-check-{darwin,linux}-{x64,arm64}.tar.gz{,.sha256} \
            intent-check-windows-{x64,arm64}.zip{,.sha256} install-intent-check.sh install-intent-check.ps1 |
            sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${assets[@]#dist/}" | sort > "$RUNNER_TEMP/local-assets.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/local-assets.txt"
          if ! gh release view "v$V" >/dev/null 2>&1; then
            if [ "$BRANCH" = main ]; then
              # The release notes are this version's CHANGELOG.md section; generated notes when it is empty or cannot be read.
              node scripts/bump-version.mjs --notes "$V" > "$RUNNER_TEMP/notes.md" || : > "$RUNNER_TEMP/notes.md"
              if [ -s "$RUNNER_TEMP/notes.md" ]; then
                gh release create "v$V" --draft --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
              else
                gh release create "v$V" --draft --generate-notes --verify-tag
              fi
            else
              gh release create "v$V" --draft --generate-notes --prerelease --verify-tag
            fi
          fi
          gh release upload "v$V" "${assets[@]}" --clobber
          gh release view "v$V" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/uploaded.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/uploaded.txt"
          gh release edit "v$V" --draft=false
