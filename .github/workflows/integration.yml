name: integration
# The real `claude -p` and `codex exec` load the hook-free plugin against a mock model API and the fake
# prover (test/integration). LLM-free: no Anthropic/OpenAI secrets, nothing here reads a secret.
# Called from ci.yml (PRs that touch bin/lib/commands/.github, pushes to main, manual runs) and
# from release.yml before it releases; also runnable by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      cli:
        description: Which Claude Code / Codex versions to install
        type: choice
        options: [pinned, latest]
        default: pinned
permissions:
  contents: read
env:
  # The versions the suite last passed with. PRs and releases use these; try newer by hand with cli=latest.
  CLAUDE_CODE_VERSION: 2.1.291
  CODEX_VERSION: 0.160.1
jobs:
  integration:
    name: integration (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the CLIs
        shell: bash
        env:
          CLI: ${{ inputs.cli || 'pinned' }}
        run: |
          if [ "$CLI" = latest ]; then
            npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest
          else
            npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"
          fi
      - name: Versions
        shell: bash
        run: |
          node --version
          claude --version
          codex --version
      - name: Integration tests
        shell: bash
        run: npm run test:integration
